<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Campus Cafe</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1 id="site-title">Campus Cafe</h1>
    <p class="tagline">Fresh coffee for busy students</p>

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#menu">Menu</a>
      <a href="index.html#hours">Hours</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Contact / Pre-order</h2>

      <p>
        Fill out the form below to contact us or place a pre-order.
      </p>

      <form action="#" method="post">

        <!-- Text -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <!-- Number -->
        <label for="quantity">Number of drinks:</label>
        <input type="number" id="quantity" name="quantity" min="1" max="20" required>

        <!-- Date -->
        <label for="date">Pickup date:</label>
        <input type="date" id="date" name="date" required>

        <!-- Radio buttons -->
        <p><strong>Preferred pickup time:</strong></p>

        <label>
          <input type="radio" name="pickup-time" value="morning" required>
          Morning
        </label>

        <label>
          <input type="radio" name="pickup-time" value="afternoon">
          Afternoon
        </label>

        <label>
          <input type="radio" name="pickup-time" value="evening">
          Evening
        </label>

        <!-- Checkboxes -->
        <p><strong>Extras:</strong></p>

        <label>
          <input type="checkbox" name="extras" value="extra-shot">
          Extra shot
        </label>

        <label>
          <input type="checkbox" name="extras" value="oat-milk">
          Oat milk
        </label>

        <label>
          <input type="checkbox" name="extras" value="syrup">
          Syrup
        </label>

        <!-- Dropdown -->
        <label for="drink">Favorite drink:</label>
        <select id="drink" name="drink" required>
          <option value="">-- Select a drink --</option>
          <option value="espresso">Espresso</option>
          <option value="iced-latte">Iced Latte</option>
          <option value="tea">Tea</option>
          <option value="coffee">Coffee</option>
        </select>

        <!-- Textarea -->
        <label for="message">Message:</label>
        <textarea
          id="message"
          name="message"
          rows="6"
          placeholder="Write your message or special request here..."
        ></textarea>

        <!-- Submit -->
        <button type="submit">Send Order</button>

      </form>
    </section>
  </main>

  <footer>
    <p>
      &copy; 2026 Campus Cafe |
      <a href="https://github.com/masabasel88-cyber/Test-project"
         target="_blank">
        Our GitHub
      </a>
    </p>
  </footer>

</body>
</html>
